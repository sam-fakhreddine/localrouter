[package]
name = "lr-headless"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LocalRouter without the desktop app: the HTTP server plus a web approvals page for firewall Ask decisions"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lr-headless"
path = "src/main.rs"

[dependencies]
lr-mcp = { workspace = true }
lr-types = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
lr-api-keys = { workspace = true }
lr-catalog = { workspace = true }
lr-clients = { workspace = true }
lr-coding-agents = { workspace = true }
lr-compression = { workspace = true }
lr-config = { workspace = true }
lr-context = { workspace = true }
lr-embeddings = { workspace = true }
lr-engines = { workspace = true }
lr-guardrails = { workspace = true }
lr-json-repair = { workspace = true }
lr-local-models = { workspace = true }
lr-marketplace = { workspace = true }
lr-mcp-via-llm = { workspace = true }
lr-memory = { workspace = true }
lr-monitoring = { workspace = true }
lr-monitor = { workspace = true }
lr-oauth = { workspace = true }
lr-providers = { workspace = true }
lr-proxy = { workspace = true }
lr-routellm = { workspace = true }
lr-router = { workspace = true }
lr-secret-scanner = { workspace = true }
lr-server = { workspace = true }
lr-skills = { workspace = true }
lr-utils = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
